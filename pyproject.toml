[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalog-search"
version = "0.1.1"
description = "Classical product ranking with typed attribute evidence and grouped evaluation"
readme = "README.md"
license = "MIT"
authors = [{name = "Nikita Evstigneev"}]
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "polars==2.1.0", "pyarrow>=20,<27", "scikit-learn==1.9.1", "lightgbm==4.7.0", "joblib>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.urls]
Repository = "https://github.com/NikkiRe/catalog-search"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "matplotlib>=3.9,<4"]

[project.scripts]
catalog-search = "catalog_search.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_search"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "catalog_search/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
